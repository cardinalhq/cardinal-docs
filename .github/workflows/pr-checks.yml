name: PR Checks

on:
  pull_request:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Checkout charts
        uses: actions/checkout@v5
        with:
          repository: cardinalhq/charts
          path: charts-checkout
      # Tests expect the chart beside this repo, as in a local checkout.
      - name: Move charts beside the repo
        run: mv charts-checkout ../charts
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
